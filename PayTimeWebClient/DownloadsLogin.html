
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>
    <!-- Place favicon.ico and apple-touch-icon.png in the root directory -->
    <link class="rtl_switch_css" href="/assets/login/css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="/assets/login/css/mdicons.min.css" rel="stylesheet" type="text/css">
    <link class="rtl_switch_css" href="/assets/login/css/app.min.css" rel="stylesheet" type="text/css">
    <link href="/assets/login/css/theme.min.css" rel="stylesheet" type="text/css">
    <!-- page css -->
    <link href="/assets/login/css/login-register.css" rel="stylesheet" type="text/css">
    <link href="/assets/login/css/custom.css" rel="stylesheet" type="text/css">
    <script src="Scripts/AppScript/Utility.js"></script>
    <style type="text/css">
        body, html {
            margin: 0;
            padding: 0;
            height: 800px;
            overflow: hidden;
        }

        #iframeHolder {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            top: 0px;
        }
    </style>
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            $('#UserName').focus();

            $('#btnsubmit').on('click', function () {
                var flag = 0;
                if ($('#UserName').val() == "") {
                    flag = 1;
                }
                if ($('#Password').val() == "") {
                    flag = 2;
                }

                if (flag > 0) {
                    if (flag == 1) {
                        alert('please enter username');
                        $('#UserName').focus();
                    }
                    if (flag == 2) {
                        alert('please enter password');
                        $('#Password').focus();
                    }
                }
                if (flag == 0) {
                    if (validate($('#UserName').val(), $('#Password').val())) {
                        $('#login-box').hide();
                        $('#iframeHolder').show();
                        $('#iframeHolder').html('<iframe id="iframe" src="https://download.mantratecapp.com//" width="100%" height="100%" ></iframe>');
                    }
                    else {
                        alert('User does not exist');
                    }
                }
            });
            $('#UserName').on('keydown', function (e) {
                if (e.keyCode == 13) {
                    if ($('#UserName').val() != "" && $('#UserName').val() != null) {
                        $('input[name = btnsubmit]').click();
                    }
                    else {
                        alert('please enter username');
                        $('#UserName').focus();
                        return false;
                    }
                }
            });

        });
    </script>

</head>
<body class="theme-mda no-loader lr-page background-img">
    <div class="page-background lr-page">
        <img src="/login/images/logo2.png" class="login-logo">
        <div class="container body-content">
            <div class="form-box" id="login-box">
                <div class="header text-theme">
                    Login
                </div>
                
                <form action="/" id="frmlogin" method="post">
                    <div class="body row">
                        <div class="col-md-12">
                            <div class="form-group input-field label-float">
                                <input class="login-input" id="UserName" name="UserName" type="text" value="Admin" />
                                <label for="username">Username:</label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group input-field label-float" id="fingerprint_password_part">
                                <input class="login-input" id="Password" name="psw" type="password" value="Admin@123" />
                                <label for="username">Password:</label>
                            </div>
                        </div>
                    </div>
                    <div class="footer">
                        <div class="row">
                            <input type="button" value="Submit" id="btnsubmit" name="btnsubmit" class="btn theme btn-block waves-effect waves-light" />
                        </div>
                    </div>
                </form>
            </div>
            <div id="iframeHolder" style="display:none"></div>
        </div>
        
    </div>
    <script src="/Scripts/jquery-1.10.2.min.js"></script>
    <script src="/Scripts/bootstrap.min.js"></script>
</body>
</html>
