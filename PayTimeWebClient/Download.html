
<!DOCTYPE html>
<html>
<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.6.0/jquery.min.js"></script>
    <script type="text/javascript">
        $(function () {
            $('#button').click(function () {
               
                if ($('#fname').val() == 'Admin' && $('#lname').val() == 'Admin') {
                    $('#login').hide();
                    $('#iframeHolder').show();
                    if (!$('#iframe').length) {
                        $('#iframeHolder').html('<iframe id="iframe" src="https://download.mantratecapp.com//"  width="100%" height="100%"></iframe>');
                    }
                    $('#buttonlg').show();
                }
                else {
                    alert('User does not exist');
                    $('#login').show();
                    $('#iframeHolder').hide();
                }

            });

            $('#buttonlg').click(function () {
                $('#login').show();
                $('#iframeHolder').hide();
                $('#button').hide();
            });
        });
    </script>
    <style type="text/css">
        body, html {
            margin: 0;
            padding: 0;
            height: 800px;
            overflow: hidden;
        }
        #iframeHolder {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            top: 0px;
        }
    </style>
</head>
<body>
    <div id="login">
        Username : <input type="text" name="fname" id="fname" value="Admin"><br>
        Password : <input type="password" name="lname" id="lname" value="Admin"><br>
        <button id="button">Login</button>
    </div>
    <button id="buttonlg" hidden>Logout</button>
    <div id="iframeHolder" style="display:none"></div>
</body>
</html>
